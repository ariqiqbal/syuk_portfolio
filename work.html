<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="work.css" />
</head>
<body class="work-page">
  <nav class="nav">
    <a href="index.html" class="logo" id="logo"></a>
    <a href="index.html#gallery" class="back">← Back to portfolio</a>
  </nav>

  <header class="work-head">
    <span class="tag" id="w-tag"></span>
    <h1 id="w-title"></h1>
    <p id="w-caption"></p>
    <p class="count" id="w-count"></p>
    <div class="filters" id="w-other"></div>
  </header>

  <main class="work-main">
    <div class="subs" id="w-subs" hidden></div>
    <div id="w-grid"></div>
    <p class="empty-msg" id="w-subempty" hidden>No photos here yet.</p>
    <p class="empty-msg" id="w-empty" hidden>No items yet. Add photos or videos in <code>config.js</code>.</p>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lb" hidden>
    <button class="lb-close" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
    <figure>
      <img id="lb-img" alt="" />
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" aria-label="Next">›</button>
    <span class="lb-count" id="lb-count"></span>
  </div>

  <footer><p id="copy"></p></footer>

  <script src="config.js"></script>
  <script src="work.js"></script>
</body>
</html>
